[package]
name = "xscraper-core"
version = "0.1.0"
edition = "2021"
description = "Text analytics core for xscraper, compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
